<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Plan Gym · Octubre</title>
<style>
:root{--bg:#0d0d0f;--bg2:#141417;--card:#18181c;--card2:#202026;--ink:#f3f3f5;--mut:#9a9aa3;--line:#2a2a31;
--acc:#e5383b;--acc2:#3a1416;--warm:#f5a524;--str:#a78bfa;--cardio:#ff8a3d;--danger:#ff5c5c;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
.wrap{max-width:640px;margin:0 auto;padding:10px 16px 96px}
h1{font-size:23px;margin:0;letter-spacing:-.3px}h2{font-size:21px;margin:0}h3{font-size:16px;margin:0}
.mut{color:var(--mut)}.sm{font-size:13px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 8px}
.acct{display:flex;align-items:center;gap:8px;font-size:13px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px 4px 4px;text-align:left;line-height:1.15}
.acct img,.acct .av{width:30px;height:30px;border-radius:50%}
.acct .av{background:var(--acc);display:grid;place-items:center;font-weight:800}
.acct small{display:block;color:var(--mut);font-size:11px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 16px;font-weight:700;background:var(--acc);color:#fff;text-decoration:none}
.btn.big{width:100%;padding:16px;font-size:17px;border-radius:16px}
.btn.o{background:var(--card);border:1.5px solid var(--line);color:var(--ink)}
.btn.d{background:transparent;border:1.5px solid var(--danger);color:var(--danger)}
.btn.s{padding:8px 12px;font-size:14px;border-radius:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12.5px;color:var(--mut);margin:6px 6px 0 0;background:var(--card2)}
.chip.k{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px}
.note{background:color-mix(in srgb,var(--warm) 14%,var(--card));border:1px solid color-mix(in srgb,var(--warm) 40%,var(--line));border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
/* ubicación fija */
.loc{position:sticky;top:0;z-index:6;background:var(--bg);padding:8px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px;border-bottom:1px solid transparent}
.loc.sh{border-bottom-color:var(--line)}
.pills{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pills+.pills{margin-top:6px}
.pill{position:relative;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:8px 4px 9px;text-align:center;line-height:1.15;overflow:hidden}
.pill b{display:block;font-size:14px}
.pill small{display:block;font-size:11px;color:var(--mut);margin-top:2px}
.pill.on{background:var(--acc);border-color:var(--acc)}
.pill.on small{color:#ffd9da}
.pill .pb{position:absolute;left:0;bottom:0;height:3px;background:var(--acc)}
.pill.on .pb{background:#fff}
.pill .ck{position:absolute;top:3px;right:6px;font-size:11px;color:var(--acc);font-weight:800}
.pill.on .ck{color:#fff}
.pill.today:not(.on){border-color:var(--acc)}
.resume{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--acc2);border:1px solid var(--acc);border-radius:14px;padding:10px 12px;font-weight:700;font-size:14px;margin:4px 0 8px}
/* días */
.wkinfo{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 10px}
.wkinfo .chip{margin:0}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dblk{position:relative;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:3px;min-height:168px}
.dblk:active,.rowb:active,.pill:active{transform:scale(.98)}
.dblk.today{border-color:var(--acc)}
.dblk.done{background:color-mix(in srgb,var(--acc) 9%,var(--card))}
.dblk .n{width:38px;height:38px;border-radius:12px;background:var(--acc);display:grid;place-items:center;font-weight:800;font-size:17px;margin-bottom:6px}
.dblk .t{font-weight:800;font-size:17px}
.dblk .s{font-size:13px;color:var(--mut)}
.dblk .f{font-size:13px;color:var(--ink);opacity:.85;margin-top:2px}
.dblk .bar{margin-top:auto}
.tag{position:absolute;top:12px;right:12px;font-size:11px;font-weight:800;background:var(--acc);border-radius:99px;padding:2px 8px}
/* día */
.dayhd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:14px 0 12px}
.kind{font-size:12px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--acc)}
.est{flex:none;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 10px;line-height:1.1}
.est b{display:block;font-size:20px}.est small{font-size:11px;color:var(--mut)}
.list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.rowb{display:grid;grid-template-columns:84px 1fr 20px;gap:12px;align-items:center;text-align:left;background:var(--card);border:1.5px solid var(--line);border-left:5px solid var(--c,var(--acc));border-radius:16px;padding:11px 12px 11px 11px;width:100%}
.rowb.ok{background:color-mix(in srgb,var(--acc) 9%,var(--card))}
.rowb .rt{display:flex;flex-direction:column;gap:1px;min-width:0}
.rowb .rt b{font-size:15.5px;line-height:1.25}
.spec{font-size:16px;font-weight:800;color:var(--acc)}
.rowb .st{font-size:20px;color:var(--mut);font-weight:700;text-align:center}
.rowb.ok .st{color:var(--acc)}
.ico{width:84px;height:48px;border-radius:10px;background:var(--card2);display:grid;place-items:center;font-size:24px}
.th{position:relative;display:block;width:84px;height:48px;border-radius:10px;overflow:hidden;background:#222;border:0;padding:0}
.th img{width:100%;height:100%;object-fit:cover;opacity:.85;display:block}
.th b{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:18px;text-shadow:0 1px 6px #000}
.sd{display:flex;gap:5px;margin-top:5px}
.sd i{width:11px;height:11px;border-radius:50%;border:2px solid var(--line)}
.sd i.d{background:var(--acc);border-color:var(--acc)}
/* video */
.vbox{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;cursor:pointer}
.vbox.v{aspect-ratio:9/16;max-height:62vh;width:auto;margin:0 auto}
.vbox img{width:100%;height:100%;object-fit:cover;display:block;opacity:.8}
.vbox .pl{position:absolute;inset:0;margin:auto;width:68px;height:68px;border-radius:50%;background:var(--acc);display:grid;place-items:center;font-size:26px;padding-left:5px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.vbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ytl{display:flex;justify-content:center;margin-top:8px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.mbox{background:var(--bg2);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:640px;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:94vh;overflow:auto}
@media (min-width:700px){.modal{align-items:center}.mbox{border-radius:22px}}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.mh b{font-size:19px;line-height:1.25}
.mh small{display:block;color:var(--mut);font-size:13px;font-weight:400;margin-top:2px}
.ib{flex:none;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:18px;display:grid;place-items:center}
.big2{font-size:26px;font-weight:800;color:var(--acc);margin:14px 0 0}
.tip{font-size:14.5px;margin:10px 0 0;opacity:.92}
.lbl{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin:18px 0 6px}
.setrow{display:flex;align-items:center;gap:6px;font-size:14px;margin-top:6px}
input.in{font:inherit;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:76px;text-align:center}
input.txt{width:100%;text-align:left}
.mrow{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
/* nav inferior */
.nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
.nav div{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:640px;width:100%}
.nav button{border:0;background:transparent;padding:6px;border-radius:12px;font-size:12px;color:var(--mut);font-weight:600}
.nav button span{display:block;font-size:19px}
.nav button.on{color:var(--acc);background:var(--card)}
.big{font-size:46px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
/* entrenar */
#train{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column}
#train.on{display:flex}
.tbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;background:var(--bg2);border-bottom:1px solid var(--line)}
.tbar .clk{text-align:center;line-height:1.1}
.tbar .clk b{font-size:26px;font-variant-numeric:tabular-nums}
.tbar .clk small{display:block;font-size:12px;color:var(--mut);font-weight:700}
.steps{display:flex;gap:4px;padding:8px 14px 0}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.steps i.d{background:var(--acc)}.steps i.c{background:#fff}
.tbody{flex:1;overflow:auto;padding:8px 16px 16px;max-width:640px;width:100%;margin:0 auto;position:relative}
.tfoot{padding:10px 16px calc(12px + env(safe-area-inset-bottom));max-width:640px;width:100%;margin:0 auto;display:flex;gap:8px}
.tfoot .btn.big{flex:1;width:auto}
.tfoot .bk{flex:0 0 31%;padding:16px 8px}
.tname{font-size:23px;font-weight:800;margin:4px 0 0;line-height:1.2}
.tes{font-size:13px;color:var(--mut);margin-bottom:6px}
.dots{display:flex;gap:10px;justify-content:center;margin:14px 0 4px}
.dots i{width:20px;height:20px;border-radius:50%;border:2px solid var(--line)}
.dots i.d{background:var(--acc);border-color:var(--acc)}.dots i.c{border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.12)}
.setlbl{text-align:center;font-size:30px;font-weight:800;margin:2px 0}
.target{text-align:center;color:var(--mut)}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 6px}
.stp{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.stp label{font-size:12px;color:var(--mut);font-weight:700;text-transform:uppercase}
.stp div{display:flex;align-items:center;gap:6px;margin-top:6px}
.stp button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-size:22px;font-weight:700;flex:none}
.stp input{flex:1;min-width:0;width:100%;font:inherit;font-size:24px;font-weight:800;text-align:center;border:0;background:transparent;color:var(--ink);padding:4px 0}
.prev{text-align:center;font-size:13px;color:var(--mut)}
.ring{width:200px;height:200px;margin:14px auto 6px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .t b{font-size:48px;font-variant-numeric:tabular-nums;line-height:1}
.ring .t span{display:block;font-size:13px;color:var(--mut);margin-top:4px}
.nextc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.pausev{position:absolute;inset:0;background:rgba(13,13,15,.96);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:3;padding:20px;text-align:center}
.pausev.on{display:flex}
.gl{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.gl:first-child{border-top:0}
.gl .tx{flex:1}
.gl .sec{font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums}
.side{display:inline-block;background:var(--acc);border-radius:99px;padding:3px 12px;font-weight:800;font-size:14px;margin-top:6px}
.flash{animation:fl 1s ease 2}
@keyframes fl{50%{background:color-mix(in srgb,var(--acc) 25%,var(--bg))}}
.fast{color:var(--cardio)}.slow{color:#4ade80}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.kpi b{display:block;font-size:21px}
.kpi span{font-size:12px;color:var(--mut)}
.sum{width:100%;border-collapse:collapse}.sum td{padding:6px 4px;border-top:1px solid var(--line);font-size:14px}
.ut{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px;margin-bottom:2px}
.ut button{border:0;background:transparent;color:var(--mut);font-weight:800;font-size:13px;padding:4px 12px;border-radius:8px;width:auto;height:auto}
.ut button.on{background:var(--acc);color:#fff}
.stp .ut button{width:auto;height:auto;font-size:13px}
.gvid .vbox.v{max-height:42vh}.gvid .ytl{margin-top:6px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="nav"><div>
 <button data-act="v" data-v="plan" id="nv-plan"><span>🏋️</span>Plan</button>
 <button data-act="v" data-v="desk" id="nv-desk"><span>🪑</span>Escritorio</button>
 <button data-act="v" data-v="cuenta" id="nv-cuenta"><span>👤</span>Cuenta</button>
</div></nav>
<section id="train"></section>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>

<script>
"use strict";
/* ============ DATOS DEL PLAN ============ */
const START=new Date(2026,9,6); // martes 6 de octubre de 2026
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const WEEKS=[
 {n:1,t:"Técnica",rir:"3 reps en reserva",main:3,cardio:20,lvl:"nivel base",rounds:6},
 {n:2,t:"Más volumen",rir:"2 reps en reserva",main:4,cardio:20,lvl:"+1 nivel",rounds:7},
 {n:3,t:"Subir carga",rir:"1–2 reps en reserva",main:4,cardio:20,lvl:"+2 niveles",rounds:8},
 {n:4,t:"La más exigente",rir:"1 rep en reserva",main:4,cardio:20,lvl:"+3 niveles",rounds:8}
];
const W=n=>WEEKS[n-1];
/* n = nombre en portugués (Brasil) · es = nombre en español */
const EX={
 remo:{n:"Remada com apoio no peito",es:"Remo con pecho apoyado",mus:"Costas",m:1,r:10,rest:90,v:"IxbCFPv2GyY",
  tip:"Pecho pegado al banco. Codos hacia atrás y abajo. Hombros lejos de las orejas."},
 pressInc:{n:"Supino inclinado com barra",es:"Press inclinado con barra (banco ~30°)",mus:"Peito superior",m:1,r:8,rest:90,v:"RkveusFgV30",
  tip:"Omóplatos juntos y abajo. Barra a la parte alta del pecho. Muñeca apilada: barra en la base de la palma, alineada con el antebrazo. Si duele la muñeca (no cansancio), cambiá a mancuernas con agarre neutro."},
 jalon:{n:"Puxada frontal com pegada neutra",es:"Jalón al pecho, agarre neutro",mus:"Costas",m:1,r:10,rest:90,v:"Su1dfZDi0sk",
  tip:"Pecho arriba. Bajá hasta el mentón sin balancearte. Hombros abajo."},
 cruce:{n:"Crossover de baixo para cima",es:"Cruce de poleas de abajo hacia arriba",mus:"Peito superior",sw:[3,2,2,2],r:12,rest:60,v:"VhrLZ26mch8",
  tip:"Juntá las manos a la altura del mentón y apretá el centro del pecho 1 s."},
 face:{n:"Face pull na corda",es:"Face pull con cuerda",mus:"Ombro posterior",s:3,r:15,rest:60,v:"tIuXc_X8T4I",
  tip:"Tirá hacia la cara con los codos altos y abrí las manos hacia afuera. Es postura pura."},
 lat:{n:"Elevação lateral com halteres",es:"Elevaciones laterales con mancuernas",mus:"Ombro lateral",sw:[3,2,2,2],r:12,rest:45,v:"aVa9ce3SlSA",
  tip:"Subí hasta la altura del hombro, codo apenas flexionado, sin encoger los hombros. Peso liviano."},
 curlA:{n:"Rosca direta com halteres",es:"Curl de bíceps con mancuernas",mus:"Bíceps",ss:1,sw:[3,3,3,3],r:10,rest:0,v:"RsHskJ9k_p0",
  tip:"Codos pegados al cuerpo, sin balancear. Bajá controlado. Superserie: pasás directo al tríceps."},
 triA:{n:"Tríceps na polia com corda",es:"Tríceps en polea con cuerda",mus:"Tríceps",ss:1,sw:[3,3,3,3],r:12,rest:60,v:"20incKRiLek",
  tip:"Codos fijos a los costados. Abrí la cuerda al final del movimiento."},
 cardio:{k:"cardio",n:"Cardio contínuo (bike ou trote leve na esteira)",es:"Cardio continuo (bici o trote suave en cinta)",mus:"Fôlego",
  tip:"Ritmo en el que podés hablar con frases cortas. Bici, o trote suave en la cinta (7–8 km/h). Cada semana subí un nivel de resistencia en la bici o 0,5 km/h en la cinta."},
 rdl:{n:"Levantamento terra romeno (stiff) com barra",es:"Peso muerto rumano con barra",mus:"Lombar",m:1,sw:[3,3,3,3],r:10,rest:90,v:"pCrNlGFo7h4",
  tip:"Cadera hacia atrás, rodillas apenas flexionadas, espalda neutra, barra pegada a las piernas. Semana 1: liviano para aprender el movimiento."},
 lumbar:{n:"Extensão lombar no banco (hiperextensão)",es:"Extensión lumbar en banco",mus:"Lombar",s:2,r:12,rest:60,v:"atEI-PfmpBI",
  tip:"Subí hasta quedar en línea recta con el cuerpo, sin arquear de más."},
 gemelo:{n:"Panturrilha em pé",es:"Pantorrillas de pie",mus:"Panturrilha",sw:[2,2,2,2],r:15,rest:60,v:"1BL4681pIz4",
  tip:"Pausa de 1 s arriba y 1 s abajo estirando. Sin rebotar."},
 prancha:{n:"Prancha frontal",es:"Plancha frontal",mus:"Core",s:2,r:30,u:"s",nokg:1,rest:45,v:"nmX0DysvqcQ",
  tip:"Antebrazos bajo los hombros, cuerpo recto de la cabeza a los talones. Apretá abdomen y glúteos; no dejes caer la cadera."},
 plankLat:{n:"Prancha lateral",es:"Plancha lateral",mus:"Core",s:2,r:20,u:"s por lado",nokg:1,rest:45,v:"kyOeSuh7LLo",

 supHal:{n:"Supino reto com halteres",es:"Press plano con mancuernas",mus:"Peito",m:1,r:10,rest:90,v:"W-qU8CF-WeU",
  tip:"Omóplatos juntos y abajo. Bajá controlado hasta los costados del pecho. Si te molesta la muñeca, girá las palmas para que se miren (agarre neutro)."},
 remoPol:{n:"Remada baixa na polia com pegada neutra",es:"Remo en polea baja, agarre neutro",mus:"Costas",m:1,r:10,rest:90,v:"hiujo_wbkLU",
  tip:"Torso quieto. Tirá hacia el ombligo y juntá los omóplatos."},
 pecDeck:{n:"Voador (peck deck)",es:"Pec deck o aperturas en polea",mus:"Peito (centro)",s:3,r:12,rest:60,v:"WKfTStqIXrw",
  tip:"Apretá 1 s con las manos juntas: ese es el centro del pecho que querés llenar."},
 remoUni:{n:"Remada unilateral com halter (serrote)",es:"Remo unilateral con mancuerna",mus:"Costas",sw:[3,2,2,2],r:10,u:"por lado",rest:60,v:"3RTpS2GHo_c",
  tip:"Codo pegado al cuerpo. No gires el torso."},
 pecInv:{n:"Voador invertido",es:"Pec deck invertido",mus:"Ombro posterior",s:3,r:15,rest:60,v:"kUgxJo-dp6k",
  tip:"Brazos casi rectos. Abrí sin subir los hombros."},

const pct=p=>Math.round(p[0]/p[1]*100);

function mmss(ms){ms=Math.max(0,ms);const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function hms(ms){ms=Math.max(0,ms);const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?h+":"+String(m).padStart(2,"0"):String(m).padStart(2,"0"))+":"+String(s%60).padStart(2,"0")}

].concat(WU.slice(1))}
function guided(kind,d){const list=kind==="warm"?warmList(d):DAYS[d-1].str.map(s=>STR[s]);const b=[];list.forEach(x=>{if(!x.secs){b.push({x,side:-1,rep:0});return}for(let r=0;r<(x.reps||1);r++)for(let sd=0;sd<(x.sides||1);sd++)b.push({x,side:(x.sides||1)>1?sd:-1,rep:r})});return b}
function guidedSecs(kind,d){return guided(kind,d).reduce((a,x)=>a+(x.x.secs?x.x.secs+8:45),0)} // manual ~45 s; con tiempo: tiempo + 8 s para acomodarse
function estDay(w,d){let t=guidedSecs("warm",d)+guidedSecs("str",d);const ex=DAYS[d-1].ex;
 for(let i=0;i<ex.length;i++){const e=EX[ex[i]];
  if(e.ss){const b=EX[ex[i+1]],n=setsOf(e,w);t+=n*(workSecs(e)+workSecs(b))+(n-1)*b.rest+TRANS;i++;continue}
  if(e.k==="cardio"){t+=W(w).cardio*60+TRANS;continue}
  if(e.k==="inter"){t+=W(w).rounds*120+TRANS;continue}
  const n=setsOf(e,w);t+=n*workSecs(e)+(n-1)*e.rest+TRANS}
 return Math.round(t/60)}

 const w=V.w,d=V.d,e=EX[id],key=k(w,d,id),L=S.log[key]||{};
 let h=mhead(e.n,e.es)+vplayer(e.v,0);
 if(e.k){h+='<div class="big2" style="color:var(--cardio);font-size:21px">'+esc(cardioSpec(e,w))+'</div><div class="tip">💡 '+esc(e.tip)+'</div><div class="lbl">Tu nota</div><input class="in txt" data-f="note" data-k="'+key+'" placeholder="km, inclinación, sensaciones" value="'+esc(L.note||"")+'">'}
 else{

  for(let i=0;i<setsOf(e,w);i++){const s=(L.sets&&L.sets[i])||{};h+='<div class="setrow"><span class="mut" style="width:58px">Serie '+(i+1)+'</span>'+(e.nokg?'':'<input class="in" inputmode="decimal" placeholder="'+un+'" data-f="kg" data-i="'+i+'" data-k="'+key+'" value="'+esc(s.kg||"")+'">'+un+' ×')+'<input class="in" inputmode="numeric" placeholder="reps" data-f="reps" data-i="'+i+'" data-k="'+key+'" value="'+esc(s.reps||"")+'"></div>'}
 }
 openModal(h+'<button class="btn big" style="margin-top:16px" data-act="close">Listo</button>');
}

 openModal(h+'<button class="btn big" style="margin-top:16px" data-act="close">Listo</button>');
}

let T={end:0,run:false,mins:50,iv:null};

 const c=S.desk[today()]||0;
 let h='<h2 style="margin:8px 0 4px">🪑 Pausa de escritorio</h2><div class="mut sm">2 minutos cada 45–60 min sentado. Pesa tanto como el gym para tu postura.</div>';
 h+='<div class="card"><div class="row" style="justify-content:center">'+[45,50,60].map(m=>'<button class="btn s '+(T.mins===m?"":"o")+'" data-act="dmins" data-v="'+m+'">'+m+' min</button>').join("")+'</div>'+
  '<div class="big" id="dtm">'+mmss(T.mins*60000)+'</div><div class="row" style="justify-content:center"><button class="btn" data-act="dstart">▶ Iniciar</button><button class="btn o" data-act="dstop">■ Parar</button></div>'+
  '<div id="dmsg" class="mut sm" style="text-align:center;margin-top:10px">Pausas hoy: <b>'+c+'</b></div></div><div class="list">';
 DESK.forEach(x=>{h+='<button class="rowb" style="--c:var(--str)" data-act="video" data-id="'+x.v+'" data-vv="'+(x.vv?1:0)+'" data-t="'+esc(x.n)+'"><span class="th"><img loading="lazy" src="'+thumb(x.v)+'" alt=""><b>▶</b></span><span class="rt"><b>'+esc(x.n)+'</b><span class="spec" style="color:var(--str);font-size:14px">'+esc(x.dose)+'</span><span class="mut sm">'+esc(x.tip)+'</span></span><span class="st">›</span></button>'});
 return h+'</div>';
}
function deskPaint(){const t=$("#dtm");if(t)t.textContent=mmss(T.run?T.end-Date.now():T.mins*60000)}
function dtick(){deskPaint();if(T.run&&T.end-Date.now()<=0){T.run=false;clearInterval(T.iv);beep(3,660);
 try{if("Notification" in window&&Notification.permission==="granted")new Notification("Pausa postural: 2 minutos")}catch(e){}
 const m=$("#dmsg");if(m)m.innerHTML='<b>⏰ Hora de la pausa.</b><br><button class="btn" style="margin-top:8px" data-act="ddone">✓ Hecho, reiniciar</button>'}}
function dstart(){unlockAudio();try{if("Notification" in window&&Notification.permission==="default")Notification.requestPermission()}catch(e){}T.end=Date.now()+T.mins*60000;T.run=true;clearInterval(T.iv);T.iv=setInterval(dtick,500);dtick()}

/* ============ MODO ENTRENAR ============ */
function stepsOf(d){const D=DAYS[d-1],out=[{t:"warm"}],ex=D.ex;
 for(let i=0;i<ex.length;i++){const e=EX[ex[i]];
  if(e.ss&&ex[i+1]&&EX[ex[i+1]].ss){out.push({t:"ss",ids:[ex[i],ex[i+1]]});i++}
  else if(e.k)out.push({t:e.k,id:ex[i]});else out.push({t:"ex",id:ex[i]})}
 out.push({t:"str"});return out}
const el=()=>R?Date.now()-R.start-R.pT-(R.pA?Date.now()-R.pA:0):0;
const left=()=>R.pD-(el()-R.pS);
function phase(ph,secs){R.ph=ph;R.pS=el();R.pD=secs*1000;R.ann=-1;saveR();renderTrain()}
function stepName(st){if(st.t==="warm")return"Aquecimento postural";if(st.t==="str")return"Alongamentos finais";if(st.t==="ss")return EX[st.ids[0]].n+" + "+EX[st.ids[1]].n;return EX[st.id].n}
function stepSpec(st,w){if(st.t==="ex"){const e=EX[st.id];return setsOf(e,w)+" × "+repTxt(e)}if(st.t==="ss")return setsOf(EX[st.ids[0]],w)+" vueltas";if(st.t==="cardio"||st.t==="inter")return cardioSpec(EX[st.id],w);return""}
function lastSub(st){if(st.t==="ex")return setsOf(EX[st.id],R.w)-1;if(st.t==="ss")return setsOf(EX[st.ids[0]],R.w)*2-1;if(st.t==="warm"||st.t==="str")return guided(st.t,R.d).length-1;return 0}

function startDay(w,d){unlockAudio();keepAwake();
 R={w,d,start:Date.now(),pT:0,pA:null,i:0,sub:0,ph:"gwait",pS:0,pD:0,ann:-1};saveR();openTrain()}
function openTrain(){unlockAudio();if(R&&!R.pA)keepAwake();closeModal();$("#train").classList.add("on");document.body.style.overflow="hidden";renderTrain()}
function closeTrain(){$("#train").classList.remove("on");document.body.style.overflow="";releaseWake();renderApp()}

function foot(main,noBack){const canBack=!noBack&&!(R.i===0&&R.sub===0&&(R.ph==="work"||R.ph==="gwait"));
 return '<button class="btn o big bk" data-act="back" '+(canBack?"":"disabled")+'>‹ Atrás</button>'+main}
function renderTrain(){
 if(!R)return;
 const w=R.w,d=R.d,D=DAYS[d-1],steps=stepsOf(d),st=steps[R.i];
 let bar='<div class="tbar"><button class="ib" data-act="tmenu" aria-label="Salir">✕</button><div class="clk"><small>SEMANA '+w+' · DÍA '+d+'</small><b id="clk">'+hms(el())+'</b></div><button class="ib" data-act="pause" aria-label="Pausar">'+(R.pA?"▶":"⏸")+'</button></div>';
 bar+='<div class="steps">'+steps.map((s,i)=>'<i class="'+(R.ph==="done"||i<R.i?"d":i===R.i?"c":"")+'"></i>').join("")+'</div>';
 let r;
 if(R.ph==="done")r=summaryView();
 else if(R.ph==="trans")r=transView(st,steps);
 else if(st.t==="warm"||st.t==="str")r=guidedView(st.t);
 else if(st.t==="ex"||st.t==="ss")r=exView(st,steps);
 else r=cardioView(st,steps);
 const pv='<div class="pausev '+(R.pA?"on":"")+'"><div style="font-size:50px">⏸</div><h2>En pausa</h2><div class="mut">Todo está frenado: el cronómetro general y los descansos.</div><div class="big" style="font-size:34px">'+hms(el())+'</div><button class="btn big" style="max-width:320px" data-act="pause">▶ Reanudar</button></div>';
 $("#train").innerHTML=bar+'<div class="tbody">'+r[0]+'</div><div class="tfoot">'+r[1]+'</div>'+pv;
}
function ring(ms,tot,color,sub){const p=tot?Math.max(0,Math.min(1,ms/tot)):0,C=2*Math.PI*90;
 return '<div class="ring"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="90" fill="none" stroke="var(--line)" stroke-width="12"/><circle id="rg" cx="100" cy="100" r="90" fill="none" stroke="'+color+'" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-p))+'"/></svg><div class="t"><div><b id="cd">'+mmss(ms)+'</b><span>'+esc(sub||"")+'</span></div></div></div>'}
function vbtn(v,vv,t){return v?'<button class="btn o s" data-act="video" data-id="'+v+'" data-vv="'+(vv?1:0)+'" data-t="'+esc(t)+'">▶ Video</button>':''}
function exLabel(steps){return 'Ejercicio '+R.i+' de '+(steps.length-2)}
function transView(st,steps){
 const vid=st.t==="ex"?vbtn(EX[st.id].v,0,EX[st.id].n):st.t==="ss"?st.ids.map(id=>vbtn(EX[id].v,0,EX[id].n)).join(""):"";
 return['<div class="kind" style="text-align:center;margin-top:8px">Cambio de ejercicio</div>'+ring(left(),R.pD,"var(--warm)","para empezar")+
  '<div class="nextc"><div class="mut sm">Próximo · '+(st.t==="str"?"final":exLabel(steps))+'</div><div class="tname" style="font-size:19px">'+esc(stepName(st))+'</div><div class="spec">'+esc(stepSpec(st,R.w))+'</div><div class="row" style="margin-top:8px">'+vid+'</div></div>',
  foot('<button class="btn big" data-act="skip">Empezar ya</button>')]}
function guidedView(kind){
 const b=guided(kind,R.d),isW=kind==="warm",col=isW?"var(--warm)":"var(--str)",title=isW?"Aquecimento":"Alongamento";
 if(R.ph==="work"){R.ph="gwait";R.sub=0}
 const cur=b[Math.min(R.sub,b.length-1)],x=cur.x;
 const vid=x.v||"";
 const lado=cur.side<0?"":(cur.side===0?"Lado izquierdo":"Lado derecho"),vez=(x.reps||1)>1?"Vez "+(cur.rep+1)+" de "+x.reps:"";
 const tagTxt=[lado,vez].filter(Boolean).join(" · ");
 let h='<div class="kind" style="color:'+col+'">'+title+' · '+(R.sub+1)+' de '+b.length+'</div><div class="tname">'+esc(x.n)+'</div>'+(x.es?'<div class="tes">'+esc(x.es)+'</div>':'');
 if(tagTxt)h+='<div class="row" style="margin-bottom:8px"><span class="side" style="background:'+col+';color:#111;margin:0">'+esc(tagTxt)+'</span></div>';
 if(R.ph==="bout")return[h+ring(left(),R.pD,col,"respirá y soltá")+'<div class="tip">💡 '+esc(x.tip)+'</div>',
  foot('<button class="btn o big" data-act="skip">Terminar ›</button>')];
 h+='<div class="gvid">'+vplayer(vid,x.vv&&x.v)+'</div>';
 if(!x.secs)return[h+'<div class="setlbl" style="margin-top:12px">'+esc(x.dose)+'</div><div class="tip">💡 '+esc(x.tip)+'</div>',
  foot('<button class="btn big" data-act="gnext" style="background:'+col+';color:#111">✓ Hecho</button>')];
 return[h+'<div class="setlbl" style="margin-top:12px">'+x.secs+' segundos</div><div class="tip">💡 '+esc(x.tip)+'</div>',
  foot('<button class="btn big" data-act="gtime" style="background:'+col+';color:#111">▶ Iniciar '+x.secs+' s</button>')]}
function curSetInfo(st){
 if(st.t==="ex"){const e=EX[st.id];return{id:st.id,e,i:R.sub,n:setsOf(e,R.w)}}
 const n=setsOf(EX[st.ids[0]],R.w),which=R.sub%2,id=st.ids[which];return{id,e:EX[id],i:Math.floor(R.sub/2),n,which}}
function exView(st,steps){
 const w=R.w,d=R.d,c=curSetInfo(st),e=c.e,key=k(w,d,c.id),L=S.log[key]||{};
 let head='<div class="kind">'+exLabel(steps)+' · '+esc(e.mus)+(st.t==="ss"?" · 🔗 superserie":"")+'</div><div class="tname">'+esc(e.n)+'</div><div class="tes">'+esc(e.es)+'</div>';
 head+='<div class="row">'+vbtn(e.v,0,e.n)+'<span class="chip" style="margin:0">⏱ '+restTxt(e)+'</span>'+(e.m?'<span class="chip k" style="margin:0">'+esc(W(w).rir)+'</span>':'')+'</div>';
 let dots='<div class="dots">';for(let i=0;i<c.n;i++){const s=(L.sets&&L.sets[i])||{};dots+='<i class="'+(i===c.i&&R.ph!=="rest"?"c":s.done?"d":i===c.i?"c":"")+'"></i>'}dots+='</div>';
 if(R.ph==="rest"){
  const nx=st.t==="ss"?{e:EX[st.ids[0]],i:Math.floor(R.sub/2)}:{e,i:R.sub};
  return[head+dots+'<div class="kind" style="text-align:center">Descanso</div>'+ring(left(),R.pD,"var(--acc)","respirá hondo")+
   '<div class="nextc"><div class="mut sm">Siguiente</div><b>Serie '+(nx.i+1)+' de '+c.n+' · '+esc(nx.e.n)+'</b><div class="spec" style="font-size:15px">'+esc(repTxt(nx.e))+'</div></div>',
   foot('<button class="btn o big" data-act="plus" style="flex:0 0 auto;width:auto">+15 s</button><button class="btn big" data-act="skip">Saltar</button>')]}
 const cur=(L.sets&&L.sets[c.i])||{},prevIn=c.i>0&&L.sets&&L.sets[c.i-1]?L.sets[c.i-1]:null,lw=lastFor(w,d,c.id,c.i);
 const kg=cur.kg||(prevIn&&prevIn.kg)||(lw&&lw.kg)||"",reps=cur.reps||e.r;
 let body=head+dots+'<div class="setlbl" id="setlbl">Serie '+(c.i+1)+' de '+c.n+'</div><div class="target">Objetivo: <b>'+esc(repTxt(e))+'</b></div>';
 body+='<div class="inputs" style="'+(e.nokg?"grid-template-columns:1fr":"")+'">'+(e.nokg?'':'<div class="stp"><div class="ut">'+["kg","lb"].map(u=>'<button data-act="unit" data-id="'+c.id+'" data-v="'+u+'" class="'+(unitOf(c.id)===u?"on":"")+'">'+u+'</button>').join("")+'</div><div><button data-act="adj" data-f="kg" data-id="'+c.id+'" data-v="-1">−</button><input id="kg" inputmode="decimal" value="'+esc(kg)+'" placeholder="0"><button data-act="adj" data-f="kg" data-id="'+c.id+'" data-v="1">+</button></div></div>')+
  '<div class="stp"><label>'+(e.u&&e.u.indexOf("s")===0?"Segundos":"Repeticiones")+'</label><div><button data-act="adj" data-f="reps" data-v="-1">−</button><input id="reps" inputmode="numeric" value="'+esc(reps)+'"><button data-act="adj" data-f="reps" data-v="1">+</button></div></div></div>';
 if(lw)body+='<div class="prev">↩ Semana '+lw.w+': '+(e.nokg?"":(lw.kg||"–")+" "+lw.u+" × ")+(lw.reps||"–")+'</div>';
 body+='<div class="tip">💡 '+esc(e.tip)+'</div>';
 return[body,foot('<button class="btn big" data-act="setdone">✓ Serie hecha</button>')]}
function cardioView(st,steps){
 const w=R.w,e=EX[st.id],key=k(w,R.d,st.id),L=S.log[key]||{},isI=st.t==="inter";
 const head='<div class="kind" style="color:var(--cardio)">'+exLabel(steps)+' · '+esc(e.mus)+'</div><div class="tname">'+esc(e.n)+'</div><div class="tes">'+esc(e.es)+'</div><div class="spec" style="color:var(--cardio)">'+esc(cardioSpec(e,w))+'</div>';
 if(R.ph==="run"){
  if(isI){const t=el()-R.pS,rd=Math.min(W(w).rounds-1,Math.floor(t/120000)),wi=t%120000,fast=wi<30000;
   return[head+'<div class="setlbl '+(fast?"fast":"slow")+'" id="ilbl" style="margin-top:12px">'+(fast?"🔥 FUERTE":"Suave")+'</div><div class="target">Ronda '+(rd+1)+' de '+W(w).rounds+'</div>'+ring(fast?30000-wi:120000-wi,fast?30000:90000,fast?"var(--cardio)":"#4ade80","de este tramo")+'<div class="mut sm" style="text-align:center">Total restante: <b id="itot">'+mmss(left())+'</b></div>',
    foot('<button class="btn o big" data-act="cardioend">Terminar</button>')]}
  return[head+ring(left(),R.pD,"var(--cardio)","restantes")+'<div class="tip">💡 '+esc(e.tip)+'</div>',foot('<button class="btn o big" data-act="cardioend">Terminar</button>')]}
 if(R.ph==="post")return[head+'<div class="card"><b>✅ ¡Hecho!</b><div class="mut sm" style="margin:6px 0">Nota opcional: km, inclinación, sensaciones.</div><input class="in txt" id="cnote" value="'+esc(L.note||"")+'"></div>',foot('<button class="btn big" data-act="cardiosave">Seguir ›</button>')];
 return[head+'<div class="tip">💡 '+esc(e.tip)+'</div>'+(isI?'<div class="tip">Te aviso con pitidos cuándo ir <b>fuerte</b> y cuándo <b>suave</b>.</div>':''),
  foot('<button class="btn big" data-act="cardiostart" style="background:var(--cardio);color:#111">▶ Iniciar '+(isI?"intervalos":"cardio")+'</button>')]}
function summaryView(){
 const w=R.w,d=R.d,D=DAYS[d-1];let sets=0,vol=0,pvol=0,rows='';
 D.ex.forEach(id=>{const e=EX[id];if(e.k){rows+='<tr><td>'+esc(e.n)+'</td><td style="text-align:right">'+(S.chk[k(w,d,id)]?"✓":"–")+'</td></tr>';return}
  const L=(S.log[k(w,d,id)]||{}).sets||[];let best=null;L.forEach(s=>{if(s&&s.done){sets++;vol+=toKg(s)*(num(s.reps)||0);if(!best||toKg(s)>=toKg(best))best=s}});
  if(w>1)((S.log[k(w-1,d,id)]||{}).sets||[]).forEach(s=>{if(s)pvol+=toKg(s)*(num(s.reps)||0)});
  rows+='<tr><td>'+esc(e.n)+'</td><td class="mut" style="text-align:right;white-space:nowrap">'+(best?(e.nokg||!best.kg?"":wtxt(best)+" × ")+best.reps:"–")+'</td></tr>'});
 const dur=R.end||el(),diff=pvol?Math.round((vol-pvol)/pvol*100):null;
 return['<div style="text-align:center;margin-top:12px;font-size:50px">🏁</div><div class="tname" style="text-align:center">¡Día terminado!</div><div class="mut" style="text-align:center">Semana '+w+' · Día '+d+' · '+esc(D.t)+'</div>'+
  '<div class="kpi"><div><b>'+hms(dur)+'</b><span>tiempo</span></div><div><b>'+sets+'</b><span>series</span></div><div><b>'+Math.round(vol)+'</b><span>kg'+(diff!==null?' · '+(diff>=0?"▲":"▼")+Math.abs(diff)+'%':"")+'</span></div></div>'+
  '<div class="card"><table class="sum"><tbody>'+rows+'</tbody></table></div>',
  '<button class="btn big" data-act="finishclose">Volver al plan</button>']}
function logSet(id,i,kg,reps){const key=k(R.w,R.d,id);S.log[key]=S.log[key]||{};const L=S.log[key];L.sets=L.sets||[];L.sets[i]={kg:kg==null?"":String(kg),u:unitOf(id),reps:reps==null?"":String(reps),done:1};save()}
function nextStep(){const steps=stepsOf(R.d);R.i++;R.sub=0;
 if(R.i>=steps.length){finishDay();return}
 const st=steps[R.i];
 if(st.t==="str"){R.ph="gwait";saveR();renderTrain();return}
 if(R.i===1){R.ph="work";saveR();renderTrain();return}
 phase("trans",TRANS)}
function finishDay(){R.end=el();R.ph="done";S.ses[R.w+"."+R.d]={start:R.start,dur:R.end,date:today()};save();saveR();releaseWake();beep(3,990);renderTrain()}
function goBack(){
 const steps=stepsOf(R.d),st=steps[R.i];
 const prevStep=()=>{if(R.i===0){R.sub=0;R.ph="work";saveR();renderTrain();return}
  R.i--;const p=steps[R.i];R.sub=lastSub(p);
  if(p.t==="warm"||p.t==="str"){R.ph="gwait";saveR();renderTrain();return}
  R.ph=(p.t==="cardio"||p.t==="inter")?"post":"work";saveR();renderTrain()};
 if(R.ph==="trans"){prevStep();return}
 if(st.t==="ex"||st.t==="ss"){if(R.ph==="rest"||R.sub>0){R.sub--;R.ph="work";saveR();renderTrain()}else prevStep();return}
 if(st.t==="warm"||st.t==="str"){
  if(R.ph==="bout"){R.ph="gwait";saveR();renderTrain();return}
  if(R.sub>0){R.sub--;R.ph="gwait";saveR();renderTrain();return}
  prevStep();return}
 if(R.ph==="work")prevStep();else{R.ph="work";saveR();renderTrain()}
}
function onPhaseEnd(){
 const st=stepsOf(R.d)[R.i];
 if(R.ph==="rest"||R.ph==="trans"){R.ph="work";saveR();beep(2);renderTrain();const s=$("#setlbl");if(s)s.parentElement.classList.add("flash");return}
 if(R.ph==="run"){R.ph="post";saveR();beep(3);renderTrain();return}
 if(R.ph==="bout"){const b=guided(st.t,R.d);R.sub++;
  if(R.sub>=b.length){S.chk[k(R.w,R.d,st.t)]=true;save();beep(2);if(st.t==="str")finishDay();else nextStep();return}
  beep(2,660);R.ph="gwait";saveR();renderTrain();return}
}
function tick(){
 if(!R||!$("#train").classList.contains("on"))return;
 const c=$("#clk");if(c&&R.ph!=="done")c.textContent=hms(el());
 if(R.pA||R.ph==="done"||R.ph==="work"||R.ph==="post"||R.ph==="gwait")return;
 const st=stepsOf(R.d)[R.i],C=2*Math.PI*90;
 if(R.ph==="run"&&st&&st.t==="inter"){
  const t=el()-R.pS,seg=Math.floor(t/120000)*2+((t%120000)<30000?0:1);
  if(R.ann===-1)R.ann=seg;
  else if(seg!==R.ann&&left()>0){R.ann=seg;saveR();beep(seg%2===0?3:1,seg%2===0?990:660);renderTrain();return}
  const wi=t%120000,fast=wi<30000,rem=fast?30000-wi:120000-wi,cd=$("#cd"),it=$("#itot"),rg=$("#rg");
  if(cd)cd.textContent=mmss(rem);if(it)it.textContent=mmss(left());if(rg)rg.setAttribute("stroke-dashoffset",C*(1-rem/(fast?30000:90000)));
 } else {
  const cd=$("#cd"),rg=$("#rg"),l=left();if(cd)cd.textContent=mmss(l);if(rg)rg.setAttribute("stroke-dashoffset",C*(1-Math.max(0,l)/R.pD));
  if(R.ph==="rest"&&l<=3000&&l>0&&R.ann!==Math.ceil(l/1000)){R.ann=Math.ceil(l/1000);beep(1,520)}
 }
 if(left()<=0)onPhaseEnd();
}
setInterval(tick,250);

/* ============ EVENTOS ============ */
document.addEventListener("click",ev=>{
 if(ev.target.id==="modal"){closeModal();if(V.view==="plan"&&!$("#train").classList.contains("on"))renderApp();return}
 const el_=ev.target.closest("[data-act]");if(!el_)return;
 const a=el_.dataset.act,v=el_.dataset.v;
 switch(a){
  case"v":V.view=v;renderApp();window.scrollTo(0,0);break;
  case"w":V.w=+v;V.d=0;renderApp();window.scrollTo(0,0);break;
  case"d":V.d=+v;renderApp();window.scrollTo(0,0);break;
  case"play":playIn(el_);break;
  case"video":openVideo(el_.dataset.id,el_.dataset.vv==="1",el_.dataset.t||"");break;
  case"close":closeModal();if(V.view==="plan"&&!$("#train").classList.contains("on"))renderApp();break;
  case"exinfo":openEx(el_.dataset.id);break;
  case"warminfo":openList("Aquecimento postural",warmList(V.d));break;
  case"strinfo":openList("Alongamentos finais",DAYS[V.d-1].str.map(x=>STR[x]));break;
  case"rules":openModal(mhead("Reglas del plan")+'<div class="tip">• Descansos: 90 s en los pesados, 45–60 s en los chicos. La web los cuenta.<br><br>• Muñeca: si aparece dolor (no cansancio), cambiá a mancuernas con agarre neutro. Flexiones en el piso: fuera.<br><br>• Si te atrasás, recortá una serie del último ejercicio. Nunca los estiramientos.<br><br>• Dolor agudo, mareo u hormigueo: pará.</div><button class="btn big" style="margin-top:14px" data-act="close">Entendido</button>');break;
  case"start":{const w=+el_.dataset.w,d=+el_.dataset.d;
   if(prog(w,d)[0]>0)confirmBox("¿Empezar este día de nuevo?","Ya tenés registros de este día. Las series que vuelvas a hacer se sobrescriben.",'<button class="btn big" data-act="startok" data-w="'+w+'" data-d="'+d+'">Empezar</button><button class="btn o big" data-act="close">Cancelar</button>');
   else startDay(w,d);break}
  case"startok":closeModal();startDay(+el_.dataset.w,+el_.dataset.d);break;
  case"resume":openTrain();break;
  case"tmenu":confirmBox("¿Salir del entrenamiento?","",'<button class="btn o big" data-act="later">Volver al plan (sigue en curso)</button><button class="btn big" data-act="endnow">Terminar el día ahora</button><button class="btn o big" data-act="discard" style="color:var(--danger)">Descartar sesión</button><button class="btn o big" data-act="close">Cancelar</button>');break;
  case"later":closeModal();closeTrain();break;
  case"endnow":closeModal();finishDay();break;
  case"discard":closeModal();R=null;saveR();closeTrain();break;
  case"pause":if(!R)break;unlockAudio();if(R.pA){R.pT+=Date.now()-R.pA;R.pA=null;keepAwake()}else{R.pA=Date.now();releaseWake()}saveR();renderTrain();break;
  case"back":goBack();break;
  case"gstart":unlockAudio();R.sub=0;R.ph="gwait";saveR();renderTrain();break;
  case"gtime":{unlockAudio();const st=stepsOf(R.d)[R.i];phase("bout",guided(st.t,R.d)[R.sub].x.secs);break}
  case"gnext":{const st=stepsOf(R.d)[R.i],b=guided(st.t,R.d);R.sub++;if(R.sub>=b.length){S.chk[k(R.w,R.d,st.t)]=true;save();if(st.t==="str")finishDay();else nextStep()}else{R.ph="gwait";saveR();renderTrain()}break}
  case"unit":{const id=el_.dataset.id,kgI=$("#kg"),val=kgI?kgI.value:null;S.unit[id]=v;save();if(el_.dataset.m){openEx(id)}else{renderTrain();const n=$("#kg");if(n&&val!==null)n.value=val}break}
  case"skip":R.pD=el()-R.pS;onPhaseEnd();break;
  case"plus":R.pD+=15000;saveR();break;
  case"adj":{const inp=$("#"+el_.dataset.f);if(!inp)break;const x=(num(inp.value)||0)+parseFloat(v)*(el_.dataset.f==="kg"?(unitOf(el_.dataset.id)==="lb"?5:2.5):1);inp.value=String(Math.max(0,Math.round(x*10)/10));break}
  case"setdone":{unlockAudio();const st=stepsOf(R.d)[R.i],c=curSetInfo(st),kgI=$("#kg"),rI=$("#reps");
   logSet(c.id,c.i,c.e.nokg?"":(kgI?kgI.value.replace(",","."):""),rI?rI.value:"");
   if(st.t==="ex"){if(c.i<c.n-1){R.sub++;phase("rest",c.e.rest)}else{S.chk[k(R.w,R.d,c.id)]=true;save();nextStep()}}
   else{if(c.which===0){R.sub++;R.ph="work";saveR();renderTrain()}else if(c.i<c.n-1){R.sub++;phase("rest",c.e.rest)}else{st.ids.forEach(id=>S.chk[k(R.w,R.d,id)]=true);save();nextStep()}}
   break}
  case"cardiostart":{unlockAudio();const st=stepsOf(R.d)[R.i];phase("run",st.t==="inter"?W(R.w).rounds*120:W(R.w).cardio*60);break}
  case"cardioend":R.pD=el()-R.pS;onPhaseEnd();break;
  case"cardiosave":{const st=stepsOf(R.d)[R.i],key=k(R.w,R.d,st.id),n=$("#cnote");S.log[key]=S.log[key]||{};if(n)S.log[key].note=n.value;S.chk[key]=true;save();nextStep();break}
  case"finishclose":{const w=R.w,d=R.d;R=null;saveR();closeTrain();V.view="plan";V.w=w;V.d=d;renderApp();break}
  case"dmins":T.mins=+v;if(!T.run)renderApp();break;
  case"dstart":dstart();break;
  case"dstop":T.run=false;clearInterval(T.iv);renderApp();break;
  case"ddone":{const t=today();S.desk[t]=(S.desk[t]||0)+1;save();renderApp();dstart();break}
  case"snd":SND=!SND;lsSet(SKEY,SND?"1":"0");unlockAudio();if(SND)beep(1);renderApp();break;
  case"login":if(window.fbLogin)window.fbLogin();else{authMsg="No se pudo cargar el inicio de sesión. Revisá tu conexión.";renderApp()}break;
  case"logout":if(window.fbLogout)window.fbLogout();break;
  case"export":{const blob=new Blob([JSON.stringify(S)],{type:"application/json"}),u=URL.createObjectURL(blob),l=document.createElement("a");l.href=u;l.download="progreso-gym-"+today()+".json";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);break}
  case"import":$("#file").click();break;
  case"reset":confirmBox("¿Borrar todo?","Se borra tu progreso"+(user?" de este dispositivo y de tu cuenta":"")+". No se puede deshacer.",'<button class="btn d big" data-act="resetok">Sí, borrar todo</button><button class="btn o big" data-act="close">Cancelar</button>');break;
  case"resetok":S=blank();save();closeModal();renderApp();break;
 }
});
document.addEventListener("change",ev=>{const t=ev.target;
 if(t.id==="file"&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>{try{S=norm(JSON.parse(r.result));save();authMsg="Respaldo importado.";renderApp()}catch(e){authMsg="El archivo no es un respaldo válido.";renderApp()}};r.readAsText(t.files[0])}
});
document.addEventListener("input",ev=>{const t=ev.target,key=t.dataset&&t.dataset.k;if(!key)return;
 S.log[key]=S.log[key]||{};
 if(t.dataset.f==="note")S.log[key].note=t.value;
 else{const i=+t.dataset.i;S.log[key].sets=S.log[key].sets||[];S.log[key].sets[i]=S.log[key].sets[i]||{};S.log[key].sets[i][t.dataset.f]=t.value;S.log[key].sets[i].u=unitOf(key.split(".")[2])}
 save();
});

/* ============ SINCRONIZACIÓN CON LA CUENTA ============ */
function merge(remote,local){const r=norm(remote),l=norm(local),o=blank();
 o.log=Object.assign({},l.log,r.log);o.chk=Object.assign({},l.chk,r.chk);o.ses=Object.assign({},l.ses,r.ses);
 const ds=new Set([...Object.keys(l.desk),...Object.keys(r.desk)]);ds.forEach(x=>o.desk[x]=Math.max(l.desk[x]||0,r.desk[x]||0));return o}
const busy=()=>{const a=document.activeElement;return a&&(a.tagName==="INPUT")};
window.App={
 signedIn(u){user=u;authState="in";authMsg="";if(!$("#train").classList.contains("on"))renderApp()},
 signedOut(){user=null;authState="out";remoteSave=null;renderApp()},
 setSaver(fn){remoteSave=fn},
 remote(data,exists,first,pending){
  if(pending)return;
  if(first){if(exists)S=merge(data,S);lsSet(KEY,JSON.stringify(S));if(remoteSave)remoteSave(S)}
  else if(exists){S=merge(data,S);lsSet(KEY,JSON.stringify(S))}
  if(!$("#train").classList.contains("on")&&!busy())renderApp();
 },
 error(m){authMsg=m||"";if(authState==="loading")authState="out";renderApp()}
};
setTimeout(()=>{if(authState==="loading"){authState="out";renderApp()}},5000);
renderApp();
if(R&&R.ph!=="done")openTrain();
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, onSnapshot, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
// Mismo proyecto Firebase que "Tras sus pasos". El progreso del gym va en users/{uid}/gym/progreso,
// separado del progreso de los evangelios.
const firebaseConfig = {
  apiKey: "AIzaSyCjivkf6Kl355qdxfYSvgDjR5KPVecAIy0",
  authDomain: "tras-sus-pasos.firebaseapp.com",
  projectId: "tras-sus-pasos",
  storageBucket: "tras-sus-pasos.firebasestorage.app",
  messagingSenderId: "770650829331",
  appId: "1:770650829331:web:a9ef47fa5611066fd7c5e6"
};
try{
  const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
  const provider=new GoogleAuthProvider(); provider.setCustomParameters({prompt:"select_account"});
  window.fbLogin=async()=>{
    try{ await signInWithPopup(auth,provider); }
    catch(e){
      const c=(e&&e.code)||""; let m="No se pudo iniciar sesión. Intentá de nuevo.";
      if(c==="auth/popup-blocked") m="El navegador bloqueó la ventana de Google. Permití ventanas emergentes para este sitio.";
      else if(c==="auth/unauthorized-domain") m="Falta autorizar este sitio en Firebase (Authentication → Configuración → Dominios autorizados).";
      else if(c==="auth/popup-closed-by-user"||c==="auth/cancelled-popup-request") m="";
      else if(c==="auth/network-request-failed") m="Sin conexión. Revisá tu internet.";
      App.error(m);
    }
  };
  window.fbLogout=()=>signOut(auth);
  let unsub=null, timer=null;
  const perm=e=>((e&&e.code)==="permission-denied")?"Firebase bloqueó el acceso al progreso del gym: falta actualizar las reglas de Firestore (está en la guía).":null;
  onAuthStateChanged(auth,u=>{
    if(unsub){unsub();unsub=null} clearTimeout(timer);
    if(!u){App.setSaver(null);App.signedOut();return}
    App.signedIn({uid:u.uid,name:(u.displayName||"").split(" ")[0],photo:u.photoURL||""});
    const ref=doc(db,"users",u.uid,"gym","progreso"); let first=true, chain=Promise.resolve();
    App.setSaver(st=>{clearTimeout(timer);timer=setTimeout(()=>{
      const data=JSON.stringify(st);
      chain=chain.then(()=>setDoc(ref,{data,updated:serverTimestamp()})).catch(e=>App.error(perm(e)||"No se pudo guardar en tu cuenta ("+((e&&e.code)||"error")+")."));
    },700)});
    unsub=onSnapshot(ref,snap=>{const f=first;first=false;let d=null;
      if(snap.exists()){try{d=JSON.parse(snap.data().data||"{}")}catch(e){d={}}}
      App.remote(d,snap.exists(),f,snap.metadata.hasPendingWrites);
    },e=>App.error(perm(e)||"No se pudo leer tu progreso ("+((e&&e.code)||"error")+")."));
  });
}catch(e){ App.error("No se pudo conectar con la cuenta. Tu progreso se guarda en este dispositivo."); App.signedOut(); }
</script>
