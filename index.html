<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Plan Gym · Octubre</title>
<style>
:root{--bg:#0d0d0f;--bg2:#141417;--card:#18181c;--card2:#202026;--ink:#f3f3f5;--mut:#9a9aa3;--line:#2a2a31;
--acc:#e5383b;--acc2:#3a1416;--warm:#f5a524;--str:#a78bfa;--cardio:#ff8a3d;--danger:#ff5c5c;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
.wrap{max-width:640px;margin:0 auto;padding:10px 16px 96px}
h1{font-size:23px;margin:0;letter-spacing:-.3px}h2{font-size:21px;margin:0}h3{font-size:16px;margin:0}
.mut{color:var(--mut)}.sm{font-size:13px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 8px}
.acct{display:flex;align-items:center;gap:8px;font-size:13px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px 4px 4px;text-align:left;line-height:1.15}
.acct img,.acct .av{width:30px;height:30px;border-radius:50%}
.acct .av{background:var(--acc);display:grid;place-items:center;font-weight:800}
.acct small{display:block;color:var(--mut);font-size:11px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 16px;font-weight:700;background:var(--acc);color:#fff;text-decoration:none}
.btn.big{width:100%;padding:16px;font-size:17px;border-radius:16px}
.btn.o{background:var(--card);border:1.5px solid var(--line);color:var(--ink)}
.btn.d{background:transparent;border:1.5px solid var(--danger);color:var(--danger)}
.btn.s{padding:8px 12px;font-size:14px;border-radius:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12.5px;color:var(--mut);margin:6px 6px 0 0;background:var(--card2)}
.chip.k{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px}
.note{background:color-mix(in srgb,var(--warm) 14%,var(--card));border:1px solid color-mix(in srgb,var(--warm) 40%,var(--line));border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
/* ubicación fija */
.loc{position:sticky;top:0;z-index:6;background:var(--bg);padding:8px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px;border-bottom:1px solid transparent}
.loc.sh{border-bottom-color:var(--line)}
.pills{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pills+.pills{margin-top:6px}
.pill{position:relative;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:8px 4px 9px;text-align:center;line-height:1.15;overflow:hidden}
.pill b{display:block;font-size:14px}
.pill small{display:block;font-size:11px;color:var(--mut);margin-top:2px}
.pill.on{background:var(--acc);border-color:var(--acc)}
.pill.on small{color:#ffd9da}
.pill .pb{position:absolute;left:0;bottom:0;height:3px;background:var(--acc)}
.pill.on .pb{background:#fff}
.pill .ck{position:absolute;top:3px;right:6px;font-size:11px;color:var(--acc);font-weight:800}
.pill.on .ck{color:#fff}
.pill.today:not(.on){border-color:var(--acc)}
.resume{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--acc2);border:1px solid var(--acc);border-radius:14px;padding:10px 12px;font-weight:700;font-size:14px;margin:4px 0 8px}
/* días */
.wkinfo{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 10px}
.wkinfo .chip{margin:0}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dblk{position:relative;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:3px;min-height:168px}
.dblk:active,.rowb:active,.pill:active{transform:scale(.98)}
.dblk.today{border-color:var(--acc)}
.dblk.done{background:color-mix(in srgb,var(--acc) 9%,var(--card))}
.dblk .n{width:38px;height:38px;border-radius:12px;background:var(--acc);display:grid;place-items:center;font-weight:800;font-size:17px;margin-bottom:6px}
.dblk .t{font-weight:800;font-size:17px}
.dblk .s{font-size:13px;color:var(--mut)}
.dblk .f{font-size:13px;color:var(--ink);opacity:.85;margin-top:2px}
.dblk .bar{margin-top:auto}
.tag{position:absolute;top:12px;right:12px;font-size:11px;font-weight:800;background:var(--acc);border-radius:99px;padding:2px 8px}
/* día */
.dayhd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:14px 0 12px}
.kind{font-size:12px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--acc)}
.est{flex:none;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 10px;line-height:1.1}
.est b{display:block;font-size:20px}.est small{font-size:11px;color:var(--mut)}
.list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.rowb{display:grid;grid-template-columns:84px 1fr 20px;gap:12px;align-items:center;text-align:left;background:var(--card);border:1.5px solid var(--line);border-left:5px solid var(--c,var(--acc));border-radius:16px;padding:11px 12px 11px 11px;width:100%}
.rowb.ok{background:color-mix(in srgb,var(--acc) 9%,var(--card))}
.rowb .rt{display:flex;flex-direction:column;gap:1px;min-width:0}
.rowb .rt b{font-size:15.5px;line-height:1.25}
.spec{font-size:16px;font-weight:800;color:var(--acc)}
.rowb .st{font-size:20px;color:var(--mut);font-weight:700;text-align:center}
.rowb.ok .st{color:var(--acc)}
.ico{width:84px;height:48px;border-radius:10px;background:var(--card2);display:grid;place-items:center;font-size:24px}
.th{position:relative;display:block;width:84px;height:48px;border-radius:10px;overflow:hidden;background:#222;border:0;padding:0}
.th img{width:100%;height:100%;object-fit:cover;opacity:.85;display:block}
.th b{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:18px;text-shadow:0 1px 6px #000}
.sd{display:flex;gap:5px;margin-top:5px}
.sd i{width:11px;height:11px;border-radius:50%;border:2px solid var(--line)}
.sd i.d{background:var(--acc);border-color:var(--acc)}
/* video */
.vbox{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;cursor:pointer}
.vbox.v{aspect-ratio:9/16;max-height:62vh;width:auto;margin:0 auto}
.vbox img{width:100%;height:100%;object-fit:cover;display:block;opacity:.8}
.vbox .pl{position:absolute;inset:0;margin:auto;width:68px;height:68px;border-radius:50%;background:var(--acc);display:grid;place-items:center;font-size:26px;padding-left:5px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.vbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ytl{display:flex;justify-content:center;margin-top:8px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.mbox{background:var(--bg2);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:640px;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:94vh;overflow:auto}
@media (min-width:700px){.modal{align-items:center}.mbox{border-radius:22px}}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.mh b{font-size:19px;line-height:1.25}
.mh small{display:block;color:var(--mut);font-size:13px;font-weight:400;margin-top:2px}
.ib{flex:none;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:18px;display:grid;place-items:center}
.big2{font-size:26px;font-weight:800;color:var(--acc);margin:14px 0 0}
.tip{font-size:14.5px;margin:10px 0 0;opacity:.92}
.lbl{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin:18px 0 6px}
.setrow{display:flex;align-items:center;gap:6px;font-size:14px;margin-top:6px}
input.in{font:inherit;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:76px;text-align:center}
input.txt{width:100%;text-align:left}
.mrow{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
/* nav inferior */
.nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
.nav div{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:640px;width:100%}
.nav button{border:0;background:transparent;padding:6px;border-radius:12px;font-size:12px;color:var(--mut);font-weight:600}
.nav button span{display:block;font-size:19px}
.nav button.on{color:var(--acc);background:var(--card)}
.big{font-size:46px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
/* entrenar */
#train{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column}
#train.on{display:flex}
.tbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;background:var(--bg2);border-bottom:1px solid var(--line)}
.tbar .clk{text-align:center;line-height:1.1}
.tbar .clk b{font-size:26px;font-variant-numeric:tabular-nums}
.tbar .clk small{display:block;font-size:12px;color:var(--mut);font-weight:700}
.steps{display:flex;gap:4px;padding:8px 14px 0}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.steps i.d{background:var(--acc)}.steps i.c{background:#fff}
.tbody{flex:1;overflow:auto;padding:8px 16px 16px;max-width:640px;width:100%;margin:0 auto;position:relative}
.tfoot{padding:10px 16px calc(12px + env(safe-area-inset-bottom));max-width:640px;width:100%;margin:0 auto;display:flex;gap:8px}
.tfoot .btn.big{flex:1;width:auto}
.tfoot .bk{flex:0 0 31%;padding:16px 8px}
.tname{font-size:23px;font-weight:800;margin:4px 0 0;line-height:1.2}
.tes{font-size:13px;color:var(--mut);margin-bottom:6px}
.dots{display:flex;gap:10px;justify-content:center;margin:14px 0 4px}
.dots i{width:20px;height:20px;border-radius:50%;border:2px solid var(--line)}
.dots i.d{background:var(--acc);border-color:var(--acc)}.dots i.c{border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.12)}
.setlbl{text-align:center;font-size:30px;font-weight:800;margin:2px 0}
.target{text-align:center;color:var(--mut)}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 6px}
.stp{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.stp label{font-size:12px;color:var(--mut);font-weight:700;text-transform:uppercase}
.stp div{display:flex;align-items:center;gap:6px;margin-top:6px}
.stp button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-size:22px;font-weight:700;flex:none}
.stp input{flex:1;min-width:0;width:100%;font:inherit;font-size:24px;font-weight:800;text-align:center;border:0;background:transparent;color:var(--ink);padding:4px 0}
.prev{text-align:center;font-size:13px;color:var(--mut)}
.ring{width:200px;height:200px;margin:14px auto 6px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .t b{font-size:48px;font-variant-numeric:tabular-nums;line-height:1}
.ring .t span{display:block;font-size:13px;color:var(--mut);margin-top:4px}
.nextc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.pausev{position:absolute;inset:0;background:rgba(13,13,15,.96);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:3;padding:20px;text-align:center}
.pausev.on{display:flex}
.gl{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.gl:first-child{border-top:0}
.gl .tx{flex:1}
.gl .sec{font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums}
.side{display:inline-block;background:var(--acc);border-radius:99px;padding:3px 12px;font-weight:800;font-size:14px;margin-top:6px}
.flash{animation:fl 1s ease 2}
@keyframes fl{50%{background:color-mix(in srgb,var(--acc) 25%,var(--bg))}}
.fast{color:var(--cardio)}.slow{color:#4ade80}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.kpi b{display:block;font-size:21px}
.kpi span{font-size:12px;color:var(--mut)}
.sum{width:100%;border-collapse:collapse}.sum td{padding:6px 4px;border-top:1px solid var(--line);font-size:14px}
.ut{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px;margin-bottom:2px}
.ut button{border:0;background:transparent;color:var(--mut);font-weight:800;font-size:13px;padding:4px 12px;border-radius:8px;width:auto;height:auto}
.ut button.on{background:var(--acc);color:#fff}
.stp .ut button{width:auto;height:auto;font-size:13px}
.gvid .vbox.v{max-height:42vh}.gvid .ytl{margin-top:6px}

/* ===== estilo limpio ===== */
.wrap{padding:6px 16px 96px}
.top{padding:8px 2px 4px}.top h1{font-size:20px}
.acct{border:0;background:transparent;padding:0}
.btn.s{background:var(--card);color:var(--ink);font-weight:600}
.loc{padding:8px 16px 10px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-radius:14px;padding:4px;gap:2px}
.seg+.seg{margin-top:6px}
.seg button{border:0;background:transparent;border-radius:11px;padding:7px 2px;line-height:1.2;text-align:center}
.seg button b{display:block;font-size:13.5px;font-weight:700}
.seg button small{display:block;font-size:11px;color:var(--mut)}
.seg button.on{background:var(--acc)}.seg button.on small{color:#ffd6d7}
.seg button.today:not(.on) b{color:var(--acc)}
.resume{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:var(--acc2);color:var(--ink);border-radius:14px;padding:12px 14px;margin:6px 0 2px;font-size:14px}
.resume b{color:#ff8a8c}
.wsub{font-size:13px;color:var(--mut);margin:14px 4px 8px}
.dlist,.xlist{background:var(--card);border-radius:18px;overflow:hidden}
.xlist{margin-top:14px}
.drow,.xrow{display:grid;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);color:var(--ink)}
.drow:first-child,.xrow:first-child{border-top:0}
.drow{grid-template-columns:50px 1fr auto;gap:14px;padding:14px 16px}
.dt{width:50px;height:54px;border-radius:14px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.dt small{font-size:11px;color:var(--mut);text-transform:uppercase;font-weight:700;letter-spacing:.5px}
.dt b{font-size:21px;margin-top:4px}
.drow.today .dt{background:var(--acc)}.drow.today .dt small{color:#fff}
.tt{display:block;font-weight:700;font-size:16px;line-height:1.25}
.ss{display:block;font-size:13px;color:var(--mut);margin-top:3px;line-height:1.35}
.ss b{color:var(--ink);font-weight:700}
.hoy{font-style:normal;color:var(--acc);font-weight:800}
.rr{font-size:13px;color:var(--mut);white-space:nowrap}
.drow.done .rr,.xrow.ok .chev{color:var(--acc);font-weight:800;font-size:17px}
.dh{margin:14px 4px 14px}
.dh small{font-size:13px;color:var(--mut)}
.dh h2{font-size:25px;margin:3px 0 2px}
.dh .m{font-size:14px;color:var(--mut)}
.xrow{grid-template-columns:52px 1fr 16px;gap:12px;padding:12px 14px}
.xrow .tt{font-size:15px;font-weight:600}
.xrow .th,.xrow .ico{width:52px;height:52px;border-radius:12px}
.xrow .ico{font-size:22px}
.xrow .th b{font-size:15px}
.chev{color:var(--mut);font-size:18px;text-align:center}
.sd{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}
.sd i{width:8px;height:8px;border:0;background:var(--line)}
.sd i.d{background:var(--acc)}
.linkbtn{display:block;margin:16px auto 0;border:0;background:transparent;color:var(--mut);font-size:14px;padding:10px}
.ytl{margin-top:8px}.ytl a{color:var(--mut);font-size:13px}
.mbox{background:var(--bg2)}
/* entrenar */
.tbar{padding:calc(6px + env(safe-area-inset-top)) 12px 6px;background:var(--bg);border-bottom:0}
.tbar .ib{width:40px;height:40px;border:0;background:var(--card);border-radius:12px;font-size:16px}
.tbar .clk small{font-size:11px;font-weight:600;letter-spacing:0}
.tbar .clk b{font-size:22px}
.steps{padding:4px 14px 0;gap:3px}.steps i{height:3px}
.tbody{padding:14px 18px 10px}
.kind{font-size:11.5px;letter-spacing:.8px}
.tname{font-size:22px;margin-top:6px}
.tes{font-size:13px;margin-bottom:0}
.meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:14px;color:var(--mut)}
.vlink{border:0;background:transparent;color:#ff8a8c;font-weight:700;padding:0;font-size:14px}
.dots{margin:26px 0 6px;gap:8px}.dots i{width:10px;height:10px;border:0;background:var(--line)}
.dots i.d{background:var(--acc)}.dots i.c{background:#fff;box-shadow:none}
.setlbl{font-size:28px}
.target{font-size:14px}
.inputs{gap:10px;margin:22px 0 8px}
.stp{border:0;padding:12px 10px}
.stp .sl{display:flex;align-items:center;justify-content:space-between;min-height:26px;padding:0 4px}
.stp .sl label{font-size:11.5px;letter-spacing:.6px}
.stp .ut{margin:0}
.stp button{width:42px;height:42px;border:0;background:var(--card2);border-radius:12px}
.prev{margin-top:4px}
.tip{color:var(--mut);font-size:14px;margin-top:16px;line-height:1.45}
.tfoot{gap:10px;padding:8px 16px calc(14px + env(safe-area-inset-bottom))}
.tfoot .bk{flex:0 0 56px;height:56px;border:0;border-radius:16px;background:var(--card);color:var(--ink);font-size:26px;font-weight:700;padding:0}
.tfoot .btn.big{padding:16px 10px;height:56px}
.tfoot .plus{flex:0 0 auto!important;padding:0 16px!important}
.btn.o{border:0;background:var(--card)}
.ring{width:190px;height:190px;margin:22px auto 8px}
.ring svg circle:first-child{stroke:var(--card2)}
.nextc{border:0}
.side{font-size:13px;padding:3px 11px}
.gvid{margin-top:12px}
.gvid .vbox.v{max-height:34vh}
.gvid .vbox:not(.v){max-height:30vh}
.setlbl+.tip,.target+.tip{margin-top:14px}
.card{border:0}
.nav{border-top:0}
.mbox input.in{border:0;background:var(--card)}
.mbox .ib{border:0}
.big2{font-size:24px}
.side{margin-top:8px!important}

/* ===== v7: pasos, carteles, acciones ===== */
.secl{display:flex;align-items:center;gap:8px;margin:20px 4px 8px;font-size:12px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--ink)}
.secl i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.secl span{margin-left:auto;color:var(--mut);font-weight:600;letter-spacing:0;text-transform:none}
.xlist{margin-top:0}
.xrow{grid-template-columns:22px 52px 1fr 16px;border-left:3px solid var(--c,transparent)}
.xn{font-size:12px;font-weight:800;color:var(--mut);text-align:center}

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}

/* ================= HELPERS ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function dayDate(w,d){const x=new Date(START);x.setDate(x.getDate()+(w-1)*7+(d-1));return x}
const fdate=x=>x.getDate()+" "+MES[x.getMonth()];
const fdl=x=>x.getDate()+" de "+MESL[x.getMonth()];
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function todayPlan(){const t=new Date();for(let w=1;w<=4;w++)for(let d=1;d<=4;d++)if(sameDay(dayDate(w,d),t))return{w,d};return null}
function nextPlan(){const t=new Date();t.setHours(0,0,0,0);for(let w=1;w<=4;w++)for(let d=1;d<=4;d++)if(dayDate(w,d)>=t)return{w,d};return{w:4,d:4}}
function today(){const t=new Date();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")}
function mmss(ms){ms=Math.max(0,ms);const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function hms(ms){ms=Math.max(0,ms);const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?h+":"+String(m).padStart(2,"0"):String(m).padStart(2,"0"))+":"+String(s%60).padStart(2,"0")}
const num=v=>{const x=parseFloat(String(v==null?"":v).replace(",","."));return isNaN(x)?null:x};
const unitOf=id=>(S.unit&&S.unit[id])||"kg";

/* ---- pasos del día: cada calentamiento, ejercicio y estiramiento es un paso propio ---- */
function stepsOf(d){const D=DAYS[d-1],o=[];
 WU.forEach((x,i)=>o.push({t:"g",g:"w",key:"wu"+i,x}));
 D.ex.forEach(id=>o.push({t:EX[id].k?"cardio":"ex",key:id,id}));
 D.str.forEach((s,i)=>o.push({t:"g",g:"s",key:"st"+i,x:STR[s]}));
 return o}
const itemsOf=d=>stepsOf(d).map(s=>s.key);
function bouts(x){if(!x.secs)return[{side:-1,rep:0}];const b=[];for(let r=0;r<(x.reps||1);r++)for(let sd=0;sd<(x.sides||1);sd++)b.push({side:(x.sides||1)>1?sd:-1,rep:r});return b}
function prog(w,d){const it=itemsOf(d);let n=0;it.forEach(id=>{if(S.chk[k(w,d,id)])n++});return[n,it.length]}
function weekProg(w){let a=0,b=0;DAYS.forEach(D=>{const p=prog(w,D.id);a+=p[0];b+=p[1]});return[a,b]}
const pct=p=>Math.round(p[0]/p[1]*100);
function workSecs(e){if(e.u&&e.u.indexOf("Y")===0)return 60;if(e.u==="por lado")return 60;return SETW}
function gSecs(x){return x.secs?bouts(x).length*(x.secs+8):45}
function exSecs(e,fromSet){const n=e.s-(fromSet||0);if(n<=0)return 0;return n*workSecs(e)+(n-1)*e.rest}
function stepSecs(st){if(st.t==="g")return gSecs(st.x);const e=EX[st.id];return(st.t==="cardio"?e.mins*60:exSecs(e))+TRANS}
function estDay(w,d){return Math.round(stepsOf(d).reduce((a,s)=>a+stepSecs(s),0)/60)}
function cardioSegs(w){if(!W(w).iv)return[{s:1200,f:0,l:"Ritmo constante"}];
 const a=[{s:300,f:0,l:"Entrada en calor suave"}];for(let i=0;i<6;i++){a.push({s:30,f:1,l:"FUERTE",r:i+1});a.push({s:90,f:0,l:"Suave",r:i+1})}a.push({s:180,f:0,l:"Vuelta a la calma"});return a}
function cardioSpec(w){return W(w).iv?"20 min con 6 intervalos de 30 s":"20 min · "+W(w).lvl}

function unlockAudio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}}
function beep(n,f){if(navigator.vibrate)try{navigator.vibrate(n>1?[200,100,200,100,200].slice(0,n*2-1):220)}catch(e){}
 if(!SND||!AC)return;try{for(let i=0;i<(n||1);i++){const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f||880;o.connect(g);g.connect(AC.destination);const t=AC.currentTime+i*0.28;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.start(t);o.stop(t+.24)}}catch(e){}}
async function keepAwake(){try{if("wakeLock" in navigator&&!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>{wake=null})}}catch(e){}}
function releaseWake(){try{if(wake)wake.release()}catch(e){}wake=null}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&R&&!R.pA&&R.ph!=="done")keepAwake()});

function setDots(w,d,id){const e=EX[id],L=S.log[k(w,d,id)]||{};let s='<span class="sd">';for(let i=0;i<e.s;i++){const x=(L.sets&&L.sets[i])||{};s+='<i class="'+(x.done?"d":"")+'"></i>'}return s+'</span>'}
const KIND={w:{c:"var(--warm)",l:"Calentamiento",ic:"🔥"},ex:{c:"var(--acc)",l:"Ejercicio",ic:"🏋️"},cardio:{c:"var(--cardio)",l:"Cardio",ic:"🏃"},s:{c:"var(--str)",l:"Estiramiento",ic:"🧘"}};
const kindOf=st=>st.t==="g"?st.g:st.t;
function gDose(x){return x.secs?((x.reps>1?x.reps+" × ":"")+x.secs+" s"+(x.sides>1?" por lado":"")):x.dose}
function dayView(){
 const w=V.w,d=V.d,D=DAYS[d-1],dt=dayDate(w,d),steps=stepsOf(d);
 let h='<div class="dh"><small>'+D.dia+' '+fdl(dt)+' · ≈'+estDay(w,d)+' min · '+steps.length+' pasos</small><h2>'+esc(D.t)+'</h2><div class="m">'+esc(W(w).rir)+'</div></div>';

   else{const e=EX[st.id];th=e.v?'<span class="th"><img loading="lazy" src="'+thumb(e.v)+'" alt=""><b>▶</b></span>':'<span class="ico">🏃</span>';title=esc(e.n);
    sub=e.k?'<b>'+esc(cardioSpec(w))+'</b>':'<b>'+e.s+' × '+esc(repTxt(e))+'</b> · '+e.rest+' s'+setDots(w,d,st.id)}
   h+='<button class="xrow'+(done?" ok":"")+'" style="--c:'+KIND[kindOf(st)].c+'" data-act="item" data-k="'+st.key+'"><span class="xn">'+n+'</span>'+th+'<span class="xt"><span class="tt">'+title+'</span><span class="ss">'+sub+'</span></span><span class="chev">'+(done?"✓":"›")+'</span></button>'});
  h+='</div>'});
 return h+'<button class="linkbtn" data-act="rules">Reglas del plan</button>';

 openModal(h+'<button class="btn big" style="margin-top:16px" data-act="close">Listo</button>');

/* ================= MODO ENTRENAR ================= */
const el=()=>R?Date.now()-R.start-R.pT-(R.pA?Date.now()-R.pA:0):0;
const left=()=>R.pD-(el()-R.pS);
const STEPS=()=>stepsOf(R.d);
const curStep=()=>STEPS()[R.order[R.pos]];
const isMachine=st=>st&&st.t!=="g";
const done=st=>!!S.chk[k(R.w,R.d,st.key)];
function phase(ph,secs){R.ph=ph;R.pS=el();R.pD=secs*1000;R.ann=-1;saveR();renderTrain()}
function firstUndone(id){const L=S.log[k(R.w,R.d,id)]||{},n=EX[id].s;for(let i=0;i<n;i++){const s=L.sets&&L.sets[i];if(!s||!s.done)return i}return 0}
function enter(){const st=curStep();R.sub=st&&st.t==="ex"?firstUndone(st.id):0;R.ph="work";R.ann=-1}
function startDay(w,d){unlockAudio();keepAwake();
 R={w,d,start:Date.now(),pT:0,pA:null,order:stepsOf(d).map((s,i)=>i),pos:0,sub:0,ph:"work",pS:0,pD:0,ann:-1,alt:{},skip:{}};
 enter();saveR();openTrain()}
function openTrain(){unlockAudio();if(R&&!R.pA)keepAwake();closeModal();$("#train").classList.add("on");document.body.style.overflow="hidden";renderTrain()}
function closeTrain(){$("#train").classList.remove("on");document.body.style.overflow="";releaseWake();renderApp()}
/* tiempo restante estimado (s) */
function remaining(){if(!R||R.ph==="done")return 0;const steps=STEPS();let t=0;
 const st=curStep();
 if(st.t==="ex"){const e=EX[st.id];t+=exSecs(e,R.sub)+(R.ph==="rest"?Math.max(0,left())/1000:0)}
 else if(st.t==="cardio")t+=R.ph==="run"?Math.max(0,left())/1000:(R.ph==="post"?0:EX[st.id].mins*60);
 else{const b=bouts(st.x);t+=(b.length-R.sub)*(st.x.secs?st.x.secs+8:45)}
 if(R.ph==="trans")t+=Math.max(0,left())/1000;
 for(let p=R.pos+1;p<R.order.length;p++){const s=steps[R.order[p]];if(!done(s))t+=stepSecs(s)}
 return t}
function behindMin(){return Math.round((el()/1000+remaining())/60-TARGET)}

function foot(main,extra){const canBack=!(R.pos===0&&R.sub===0&&R.ph==="work");
 return (extra?'<div class="xact">'+extra+'</div>':'')+'<div class="fmain"><button class="bk" data-act="back" aria-label="Atrás" '+(canBack?"":"disabled")+'>‹</button>'+main+'</div>'}
function banner(kind,text,filled){return '<div class="banner'+(filled?" f":"")+'" style="--c:'+KIND[kind].c+'">'+text+'</div>'}
function renderTrain(){
 if(!R)return;
 const steps=STEPS(),st=curStep(),D=DAYS[R.d-1];
 const rem=R.ph==="done"?0:Math.round(remaining()/60);
 let bar='<div class="tbar"><button class="ib" data-act="tmenu" aria-label="Salir">✕</button><div class="clk"><small>'+esc(D.t)+' · Paso '+(R.ph==="done"?steps.length:Math.min(steps.length,R.pos+1))+' de '+steps.length+'</small><b id="clk">'+hms(el())+'</b><small id="rem">'+(R.ph==="done"?"terminado":"faltan ~"+rem+" min")+'</small></div><div class="row" style="gap:6px;flex-wrap:nowrap"><button class="ib" data-act="steps" aria-label="Ver todos los pasos">☰</button><button class="ib" data-act="pause" aria-label="Pausar">'+(R.pA?"▶":"⏸")+'</button></div></div>';
 bar+='<div class="steps">'+R.order.map((idx,p)=>{const s=steps[idx];const cls=done(s)?"d":p===R.pos?"c":R.skip[idx]?"sk":"";return '<i class="'+cls+'" style="--c:'+KIND[kindOf(s)].c+'"></i>'}).join("")+'</div>';
 let r;
 if(R.ph==="done")r=summaryView();
 else if(R.ph==="trans")r=transView(st);
 else if(st.t==="g")r=guidedView(st);
 else if(st.t==="ex")r=exView(st);
 else r=cardioView(st);
 const pv='<div class="pausev '+(R.pA?"on":"")+'"><div style="font-size:50px">⏸</div><h2>En pausa</h2><div class="mut">Todo está frenado.</div><div class="big" style="font-size:34px">'+hms(el())+'</div><button class="btn big" style="max-width:320px" data-act="pause">▶ Reanudar</button></div>';
 $("#train").innerHTML=bar+'<div class="tbody">'+r[0]+'</div><div class="tfoot">'+r[1]+'</div>'+pv;
}
function ring(ms,tot,color,sub){const p=tot?Math.max(0,Math.min(1,ms/tot)):0,C=2*Math.PI*90;
 return '<div class="ring"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="90" fill="none" stroke="var(--card2)" stroke-width="12"/><circle id="rg" cx="100" cy="100" r="90" fill="none" stroke="'+color+'" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-p))+'"/></svg><div class="t"><div><b id="cd">'+mmss(ms)+'</b><span>'+esc(sub||"")+'</span></div></div></div>'}
function vlink(v,t,q){return v?'<button class="vlink" data-act="video" data-id="'+v+'" data-vv="0" data-t="'+esc(t)+'">▶ Video</button>':(q?'<a class="vlink" target="_blank" rel="noopener" href="'+ytSearch(q)+'">▶ Video</a>':'')}
function exCount(st){const ex=STEPS().filter(s=>s.t!=="g");return(ex.findIndex(s=>s.key===st.key)+1)+" de "+ex.length}
function stepTitle(st){return st.t==="g"?st.x.n:(R.alt[st.id]&&EX[st.id].alt?EX[st.id].alt.n:EX[st.id].n)}
function transView(st){
 const e=st.t!=="g"?EX[st.id]:null;
 const sub=e?(e.k?cardioSpec(R.w):e.s+" × "+repTxt(e)+" · descanso "+e.rest+" s"):gDose(st.x);
 const v=e?(R.alt[st.id]&&e.alt?e.alt.v:e.v):st.x.v;
 return[banner("w","🔄 CAMBIO DE MÁQUINA",true)+'<div class="target" style="margin-top:8px">Dejá la máquina y prepará la próxima</div>'+ring(left(),R.pD,"var(--warm)","para empezar")+
  '<div class="nextc"><small>Próximo · '+KIND[kindOf(st)].l+(e?' '+exCount(st):'')+'</small><b>'+esc(stepTitle(st))+'</b><span>'+esc(sub)+'</span>'+(e?vlink(v,stepTitle(st),stepTitle(st)):'')+'</div>',
  foot('<button class="btn big" data-act="skip">Empezar ya</button>',e?'<button data-act="skipex">⏭ Está ocupada: saltar</button>'+(e.alt?'<button data-act="alt">🔁 '+(R.alt[st.id]?"Volver al original":"Usar alternativa")+'</button>':''):'')]}
function guidedView(st){
 const x=st.x,b=bouts(x),cur=b[Math.min(R.sub,b.length-1)],isW=st.g==="w";
 const list=STEPS().filter(s=>s.g===st.g),idx=list.findIndex(s=>s.key===st.key)+1;
 const lado=cur.side<0?"":(cur.side===0?"Lado izquierdo":"Lado derecho"),vez=(x.reps||1)>1?"Vez "+(cur.rep+1)+" de "+x.reps:"";
 const tag=[lado,vez].filter(Boolean).join(" · ");

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, onSnapshot, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
// Mismo proyecto Firebase que "Tras sus pasos". El progreso del gym va en users/{uid}/gym/progreso,
// separado del progreso de los evangelios.
const firebaseConfig = {
  apiKey: "AIzaSyCjivkf6Kl355qdxfYSvgDjR5KPVecAIy0",
  authDomain: "tras-sus-pasos.firebaseapp.com",
  projectId: "tras-sus-pasos",
  storageBucket: "tras-sus-pasos.firebasestorage.app",
  messagingSenderId: "770650829331",
  appId: "1:770650829331:web:a9ef47fa5611066fd7c5e6"
};
try{
  const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
  const provider=new GoogleAuthProvider(); provider.setCustomParameters({prompt:"select_account"});
  window.fbLogin=async()=>{
    try{ await signInWithPopup(auth,provider); }
    catch(e){
      const c=(e&&e.code)||""; let m="No se pudo iniciar sesión. Intentá de nuevo.";
      if(c==="auth/popup-blocked") m="El navegador bloqueó la ventana de Google. Permití ventanas emergentes para este sitio.";
      else if(c==="auth/unauthorized-domain") m="Falta autorizar este sitio en Firebase (Authentication → Configuración → Dominios autorizados).";
      else if(c==="auth/popup-closed-by-user"||c==="auth/cancelled-popup-request") m="";
      else if(c==="auth/network-request-failed") m="Sin conexión. Revisá tu internet.";
      App.error(m);
    }
  };
  window.fbLogout=()=>signOut(auth);
  let unsub=null, timer=null;
  const perm=e=>((e&&e.code)==="permission-denied")?"Firebase bloqueó el acceso al progreso del gym: falta actualizar las reglas de Firestore (está en la guía).":null;
  onAuthStateChanged(auth,u=>{
    if(unsub){unsub();unsub=null} clearTimeout(timer);
    if(!u){App.setSaver(null);App.signedOut();return}
    App.signedIn({uid:u.uid,name:(u.displayName||"").split(" ")[0],photo:u.photoURL||""});
    const ref=doc(db,"users",u.uid,"gym","progreso"); let first=true, chain=Promise.resolve();
    App.setSaver(st=>{clearTimeout(timer);timer=setTimeout(()=>{
      const data=JSON.stringify(st);
      chain=chain.then(()=>setDoc(ref,{data,updated:serverTimestamp()})).catch(e=>App.error(perm(e)||"No se pudo guardar en tu cuenta ("+((e&&e.code)||"error")+")."));
    },700)});
    unsub=onSnapshot(ref,snap=>{const f=first;first=false;let d=null;
      if(snap.exists()){try{d=JSON.parse(snap.data().data||"{}")}catch(e){d={}}}
      App.remote(d,snap.exists(),f,snap.metadata.hasPendingWrites);
    },e=>App.error(perm(e)||"No se pudo leer tu progreso ("+((e&&e.code)||"error")+")."));
  });
}catch(e){ App.error("No se pudo conectar con la cuenta. Tu progreso se guarda en este dispositivo."); App.signedOut(); }
</script>
